# DONGJIN local Redis-compatible runtime.
# This file is intentionally bound to localhost and started manually.

bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

loglevel notice
logfile "E:/Java/DONGJIN/runtime/memurai/memurai-log.txt"
databases 16

# Keep a small recoverable local snapshot without accumulating history files.
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir E:/Java/DONGJIN/runtime/memurai

# Hard safety boundary for dynamic grid snapshots.
# Snapshot keys have TTLs; evict the ones closest to expiry first.
maxmemory 256mb
maxmemory-policy volatile-ttl

appendonly no
